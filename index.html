<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Tags Panel -->
    <div id="tags-wrapper">
      <div id="tags-panel">
        <div id="tags-container"></div>
      </div>
    </div>

    <!-- Main Grid Panels -->
    <div class="main-grid">
      <!-- Vertical Panel: To-Do + Image -->
      <div id="vertical-panel">
        <!-- To-Do Section -->
        <div id="todo-section">
          <h2>To-Do List</h2>
          <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task" />
            <button id="addBtn">Add</button>
          </div>
          <ul id="taskList"></ul>
        </div>

        <!-- Image Section -->
        <div id="image-section">
          <input type="file" id="imageInput" accept="image/*" />
          <button id="changeImageBtn" style="display: none">
            Change Image
          </button>
          <img id="userImage" src="" alt="Your Image" />
        </div>
      </div>

      <!-- Notes Panel -->
      <div id="notes-panel">
        <div class="notes-header">
          <h2>Notes</h2>
          <button id="theme-toggle">🌙</button>
        </div>

        <form id="noteForm">
          <input type="text" id="noteName" placeholder="Note" required />
          <input type="text" id="noteTag" placeholder="Tag" required />

          <!-- Cute Color Palette -->
          <div id="colorPalette">
            <div
              class="color-circle"
              data-color="#ff6b6b"
              style="background: #ff6b6b"
            ></div>
            <div
              class="color-circle"
              data-color="#feca57"
              style="background: #feca57"
            ></div>
            <div
              class="color-circle"
              data-color="#54a0ff"
              style="background: #54a0ff"
            ></div>
            <div
              class="color-circle"
              data-color="#1dd1a1"
              style="background: #1dd1a1"
            ></div>
            <div
              class="color-circle"
              data-color="#5a67d8"
              style="background: #5a67d8"
            ></div>
            <div
              class="color-circle"
              data-color="#ff9ff3"
              style="background: #ff9ff3"
            ></div>
          </div>

          <input type="date" id="noteDate" />
          <textarea
            id="noteText"
            placeholder="Write your note..."
            required
          ></textarea>
          <button type="submit">Add Note</button>
        </form>

        <div id="notes-container"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
